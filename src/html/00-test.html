<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <title>test</title>
    <style>
      body {
        font-family: sans-serif;
        gap: 50px;
        margin: 50px;
      }
      .box {
        text-align: center;
        border: 1px solid #ccc;
        padding: 20px;
        border-radius: 10px;
        width: 200px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-top: 8px;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <a href="/index.html">INDEX로 이동</a>
    <br />
    <hr />
    <h2>img와 figure 사용 비교 예시</h2>
    <!-- 그냥 <img> -->
    <div class="box">
      <h3>&lt;img&gt;만 사용</h3>
      <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Example.svg" alt="예시 아이콘" width="100" />
    </div>
    <br />
    <!-- <figure> + <figcaption> -->
    <div class="box">
      <h3>&lt;figure&gt; 사용</h3>
      <figure>
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Example.svg" alt="예시 아이콘" width="100" />
        <figcaption>채팅 상담 아이콘</figcaption>
      </figure>
    </div>
    <br />
    <hr />
    <h2>WAI-ARIA 예시</h2>
    <!-- Role: 버튼, Property: aria-label, State: aria-pressed -->
    <button role="button" aria-label="즐겨찾기 토글" aria-pressed="false">★ 즐겨찾기</button>

    <!-- Role: 체크박스, Property: aria-labelledby, State: aria-checked -->
    <div role="checkbox" aria-labelledby="newsletterLabel" aria-checked="true" tabindex="0">
      <span id="newsletterLabel">뉴스레터 구독</span>
    </div>

    <!-- Role: 메뉴, Property: aria-orientation, State: aria-expanded -->
    <div role="menu" aria-orientation="vertical">
      <div role="menuitem" aria-expanded="false" tabindex="0">메뉴 항목 1</div>
      <div role="menuitem" aria-expanded="true" tabindex="0">메뉴 항목 2</div>
    </div>
  </body>
</html>
