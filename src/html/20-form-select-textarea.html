<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <title>form(select, textarea) 요소</title>
    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
        display: none;
      }
    </style>
  </head>
  <body>
    <a href="/index.html">INDEX로 이동</a>
    <h1>form(select, textarea) 요소</h1>
    <h2>select 요소</h2>
    <!-- 콤보 박스 -->
    <div>
      <label for="petSelect">반려 동물</label>
      <select name="petSelect" id="petSelect">
        <option value="">반려동물 선택</option>
        <option value="dog">강아지</option>
        <option value="cat">고양이</option>
        <option value="hamster">햄스터</option>
        <option value="spider">거미</option>
        <option value="goldsfish">열대어</option>
        <option value="parrot">패럿</option>
      </select>
    </div>
    <hr />
    <!-- 리스트 박스 -->
    <div>
      <label for="petSelect">반려 동물</label>
      <select size="10" multiple name="petSelect" id="petSelect">
        <option value="">반려동물 선택</option>
        <option value="dog">강아지</option>
        <option value="cat">고양이</option>
        <option value="hamster">햄스터</option>
        <option value="spider">거미</option>
        <option value="goldsfish">열대어</option>
        <option value="parrot">패럿</option>
      </select>
    </div>
    <hr />
    <h2>textarea 요소</h2>
    <div>
      <label for="message"
        >내용
        <span aria-hidden="true">*</span>
        <span class="sr-only">필수</span>
      </label>
      <textarea name="message" id="message" cols="30" rows="10"></textarea>
    </div>
    <br />
    <hr />
    <h1>반려동물 설문조사_GPT가 써준 예제 코드</h1>

    <form action="/submit" method="post">
      <!-- select -->
      <div>
        <label for="petSelect">가장 좋아하는 반려동물은?</label><br />
        <select name="petSelect" id="petSelect">
          <option value="">선택하세요</option>
          <option value="dog">강아지</option>
          <option value="cat">고양이</option>
          <option value="hamster">햄스터</option>
          <option value="dolpu">돌푸</option>
        </select>
      </div>

      <br />

      <!-- textarea -->
      <div>
        <label for="reason">그 이유를 자유롭게 적어주세요</label><br />
        <textarea name="reason" id="reason" rows="5" cols="40" placeholder="예: 귀엽고 충성심이 강해서 좋아요"></textarea>
      </div>

      <br />

      <!-- 제출 버튼 -->
      <button type="submit">제출하기</button>
    </form>
  </body>
</html>
